# End-4 style layout, recolored to Nord
add_newline = false

format = """
$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = '-'
style = 'fg:#4C566A'

# Prompt character
[character]
success_symbol = "[❯](bold fg:#A3BE8C)"
error_symbol   = "[❯](bold fg:#BF616A)"
vimcmd_symbol  = "[❮](bold fg:#88C0D0)"

# Hide package module
[package]
disabled = true

[git_branch]
style = "bg:#434C5E"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " [](bold fg:#434C5E)[$symbol $branch(:$remote_branch)](fg:#ECEFF4 bg:#434C5E)[ ](bold fg:#434C5E)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold fg:#BF616A)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 "
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](fg:#A3BE8C)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[•$hostname](bg:#434C5E bold fg:#ECEFF4)[](bold fg:#434C5E)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:#434C5E fg:#ECEFF4"
style_root = "red bold"
format = "[](bold fg:#434C5E)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = "󰋜 "
read_only = " 󰑖 "
style = "bg:#4C566A fg:#81A1C1"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:#4C566A)[󰉋 → $path]($style)[](bold fg:#4C566A)'

[directory.substitutions]
"Desktop" = " 󰏓 "
"Documents" = " 󰈭 "
"Downloads" = " 󰇈 "
"Music" = " 󰝚 "
"Pictures" = " 󰉏 "
"Videos" = " 󰕧 "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:#434C5E)[󰪢 $duration](bold bg:#434C5E fg:#8FBCBB)[](bold fg:#434C5E)'
